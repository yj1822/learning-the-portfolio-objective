version: 2
experiment_name: top500_final20_conservative_factor_cumulative
data_config: configs/data_us_equity_ml.yaml
data_master_panel_path: data/processed/us_equity_ml/master_panel_final20_conservative_pilot.parquet
max_feature_data_year: 2007

universe: top500
feature_set: final20_conservative
risk_model: factor
methods:
  - static_ml
  - static_ml_star
  - portfolio_ml_linear
  - portfolio_ml_rf
unstable_diagnostic_methods: []

protocol: cumulative_oos_validation
cumulative_oos_validation:
  data_start: "1990-01-31"
  analysis_start: "1995-01-31"
  validation_oos_start_year: 1996
  first_test_year: 2005
  last_test_year: 2024
  pilot_test_years: [2005, 2006, 2007]
  return_validation_years: 10
  return_min_train_months: 24
  return_min_validation_months: 12
  selection_statistic: official_method_specific_cumulative_objective

fast_split:
  train_start: "1995-01-31"
  train_end: "2014-12-31"
  validation_start: "2015-01-31"
  validation_end: "2017-12-31"
  test_start: "2018-01-31"
  test_end: "2024-12-31"
rolling_yearly:
  first_test_year: 2005
  last_test_year: 2024
  analysis_start: "1995-01-31"
  validation_years: 3

baseline_gamma: 10
baseline_aum: 1000000000
random_seed: 20260710

return_ml:
  models: [ridge, rf_ridge]
  lambda_grid: [0.01, 0.1, 1, 10, 100, 1000]
  rf_p_grid: [32, 64]
  rf_eta_grid: [0.1, 0.5]
  rank_gross_leverage: 1.0

markowitz_ml:
  covariance_ridge: 1.0e-8
  max_leverage: null

static_ml:
  phi_grid: [1, 3, 6, 12]
  mu_shrinkage_grid: [0.01, 0.05, 0.1, 0.25, 0.5, 1.0]
  covariance_ridge: 1.0e-8

static_ml_star:
  u_grid: [0.05, 0.1, 0.25, 0.5, 1.0]
  v_grid: [0, 0.25, 0.5, 1.0]
  k_grid: [0.5, 1.0, 2.0]
  covariance_adjustment: cov_add
  covariance_ridge: 1.0e-8

portfolio_ml:
  lambda_grid: [0.1, 1, 10, 100, 1000, 10000]
  rf_p_grid: [32, 64]
  rf_eta_grid: [0.1, 0.5]
  use_matrix_m: true
  matrix_m_iterations: 10
  expected_market_return: 0.007
  risk_free_rate: 0.0
  allow_scalar_rho_fallback: false
  rho_grid_if_fallback: [0.5]
  volatility_floor: 0.01
  coefficient_ridge_floor: 1.0e-10
  add_constant: true
  feature_set: final20_conservative
  universe: top500
  rf_version: official_cos_sin_v2
  cost_model_version: adv_quadratic_v1

risk:
  inputs_dir: data/processed/us_equity_ml/risk_repaired
  diagonal_source: vol_12m
  variance_floor: 1.0e-6
  factor_daily_to_monthly: 21.0
  allow_factor_fallback: false
  factor_max_idio_missing_fraction: 0.10
  factor_variance_ratio_max: 25.0
  factor_max_annualized_asset_volatility: 2.0
  factor_model_version: repaired_ridge_full_cov_v2

accounting:
  charge_exit_costs: true
  missing_exit_return: 0.0
  wealth_growth_floor: 0.1

method_execution:
  initial_position: value_weighted
  cost_model_version: adv_quadratic_v1
  fail_on_factor_fallback: true
  fail_on_matrix_fallback: true
  matrix_eigenvalue_tolerance: 1.0e-7

# Covariance, cost and matrix-m objects are feature-set independent. RF cache
# keys include feature_set, so sharing cannot mix Core10 and Final15 designs.
cache:
  root: results/checkpoints/top500_core10_cumulative/cache
  rf_version: official_cos_sin_v2
  cost_model_version: adv_quadratic_v1
  factor_model_version: repaired_ridge_full_cov_v2

checkpoint:
  root: results/checkpoints/top500_final20_conservative_cumulative
  resume: true
  checkpoint_each_candidate_year: true
  checkpoint_each_test_year: true

profiling:
  enabled: true
  top_functions: 30
  full_run_limit_hours: 24
  hard_stop_hours: 24

robustness:
  newey_west_lags: 6
  bootstrap_block_months: 12
  bootstrap_replications: 2000

outputs:
  experiments_dir: results/experiments
  reports_dir: reports/model_results
  pilot_dir: results/experiments/top500_final20_conservative_factor_cumulative_pilot
  formal_dir: results/experiments/top500_final20_conservative_factor_cumulative
  formal_reports_dir: reports/model_results/top500_final20_conservative_pilot
  save_plots: false

safety:
  max_peak_memory_gib: 12
  max_portfolio_mean_leverage: 3
  max_portfolio_monthly_leverage: 10
  max_portfolio_mean_turnover: 3
  max_portfolio_monthly_turnover: 10
  max_full_runtime_hours: 24
